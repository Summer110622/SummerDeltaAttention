[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "summer-delta-attention"
version = "0.1.0"
description = "Research reference for SDA v5-Gated: no-decay delta state with indexed KV correction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.1"]
authors = [{name = "summer"}]
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["summer_delta_attention*"]
