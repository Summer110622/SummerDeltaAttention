name: NumPy reference tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[research]"
      - run: python -m unittest discover -s tests -v
      - run: python -m examples.quickstart
      # Regenerate the benchmark and figures (~15 s) and re-check that the
      # freshly produced CSV still matches the README headline numbers.
      - run: OPENBLAS_NUM_THREADS=1 python research/experiment.py
      - run: python research/figures.py
      - run: python -m unittest tests.test_artifacts -v
